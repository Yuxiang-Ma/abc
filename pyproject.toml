[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abc-minimal"
version = "0.1.0"
description = "Minimal end-to-end release for the abc dataset and the ABC-DiT policy."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch==2.11.0+cu128",
    "torchcodec==0.11.0+cpu",
    "mujoco",
    "mujoco-warp",
    "warp-lang",
    "mjviser",
    "viser",
    "imageio[ffmpeg]",
    "ftfy",
    "regex",
    # tyro powers the dataclass CLI configs.
    "tyro",
    # hf_prepare.py lists and downloads node-sharded ABC-130k data.
    "huggingface_hub",
    # mcap-protobuf-support already pulls in mcap, but list it explicitly
    # so users who only run scripts/export_mcap.py see the dep up front.
    "mcap",
    "mcap-protobuf-support",
    # Optional: W&B logging in train.py (off by default; --log-wandb to enable).
    "wandb",
]

[project.optional-dependencies]
deploy = [
    "dynamixel-sdk",
    "evdev; sys_platform == 'linux'",
    "gymnasium>=1.1",
    "h5py",
    "i2rt @ git+https://github.com/arthurallshire/i2rt-drivers.git@852f6fff33970fe9b882c53e6b28c66172c97291",
    "msgpack",
    "mink==1.1.0",
    "opencv-python",
    "pyrealsense2; sys_platform == 'linux'",
    "pyzmq",
    "websockets",
]
dev = ["ruff"]

[tool.uv]
override-dependencies = [
    "mujoco==3.6.0",  # mjviser floor; i2rt's real-robot path uses stable APIs.
    "tyro>=1.0.5",
]

[tool.setuptools.packages.find]
include = ["abc_minimal*", "deploy*"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchcodec = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
